<app-header />
  <div class="container mt-5">
      <div class="row">
        <div class="col-md-4">
          <app-form-customers
            (loadAllCustomersAfterAddEvent)="getAllCustomersAfterSave()" />
        </div>
        <div class="col-md-8">
          <app-list-customers
            [customers]="customers()"
            [totalElements]="totalElements()"
            [totalPages]="totalPages()"
            [currentPage]="currentPage()"
            [pageSize]="pageSize()"
            [searchQuery]="searchQuery()"
            [isLoading]="isLoading()"
            (onSearch)="onSearch($event)"
            (onClearSearch)="clearSearch()"
            (onPageChange)="goToPage($event)"
            (onPageSizeChange)="pageSize.set($event); loadPage(0)"
            (onDetail)="openDetailModal($event)"/>
        </div>
      </div>
  </div>
<!-- <app-footer /> -->
