<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1a3a6b"/>
      <stop offset="100%" stop-color="#1e4d8c"/>
    </linearGradient>
    <!-- Ground gradient -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- Gold gradient -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <!-- Gold horizontal -->
    <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <!-- Column gradient -->
    <linearGradient id="col" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="40%" stop-color="#2d5a8e"/>
      <stop offset="100%" stop-color="#1a3256"/>
    </linearGradient>
    <!-- Building body -->
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#162d4f"/>
      <stop offset="50%" stop-color="#1e3d6b"/>
      <stop offset="100%" stop-color="#162d4f"/>
    </linearGradient>
    <!-- Glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <!-- Moon glow -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#bae6fd" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <!-- Card shine -->
    <linearGradient id="cardShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a6e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background sky -->
  <rect width="800" height="520" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#e0f2fe" opacity="0.7">
    <circle cx="50" cy="30" r="1.2"/><circle cx="120" cy="15" r="0.8"/>
    <circle cx="200" cy="40" r="1.4"/><circle cx="310" cy="20" r="0.9"/>
    <circle cx="450" cy="10" r="1.1"/><circle cx="560" cy="35" r="1.3"/>
    <circle cx="650" cy="18" r="0.8"/><circle cx="730" cy="45" r="1.2"/>
    <circle cx="780" cy="22" r="0.9"/><circle cx="90" cy="60" r="0.7"/>
    <circle cx="170" cy="75" r="1"/><circle cx="680" cy="60" r="0.8"/>
    <circle cx="750" cy="80" r="1.1"/><circle cx="25" cy="85" r="0.9"/>
    <circle cx="400" cy="55" r="0.7"/><circle cx="500" cy="70" r="1"/>
  </g>

  <!-- Moon -->
  <circle cx="680" cy="70" r="35" fill="url(#moonGlow)"/>
  <circle cx="680" cy="70" r="22" fill="#f0f9ff" opacity="0.95"/>
  <circle cx="693" cy="63" r="18" fill="#1a3a6b"/>

  <!-- City skyline (background buildings) -->
  <g opacity="0.35" fill="#0f2a4a">
    <rect x="0" y="260" width="40" height="180"/><rect x="5" y="240" width="30" height="20"/>
    <rect x="45" y="290" width="30" height="150"/><rect x="80" y="270" width="25" height="170"/>
    <rect x="108" y="300" width="35" height="140"/><rect x="147" y="255" width="28" height="185"/>
    <rect x="650" y="280" width="35" height="160"/><rect x="690" y="265" width="30" height="175"/>
    <rect x="725" y="290" width="40" height="150"/><rect x="768" y="270" width="32" height="170"/>
  </g>

  <!-- Ground / plaza -->
  <rect x="0" y="390" width="800" height="130" fill="url(#ground)"/>
  <!-- Plaza marble lines -->
  <g stroke="#1e3d6b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="410" x2="800" y2="410"/>
    <line x1="0" y1="430" x2="800" y2="430"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
  </g>
  <!-- Steps -->
  <rect x="160" y="378" width="480" height="14" fill="#1a3256" rx="2"/>
  <rect x="175" y="366" width="450" height="14" fill="#1e3a6b" rx="2"/>
  <rect x="190" y="354" width="420" height="14" fill="#22427a" rx="2"/>
  <!-- Steps gold edge -->
  <rect x="160" y="378" width="480" height="2" fill="url(#goldH)" opacity="0.5"/>
  <rect x="175" y="366" width="450" height="2" fill="url(#goldH)" opacity="0.5"/>
  <rect x="190" y="354" width="420" height="2" fill="url(#goldH)" opacity="0.5"/>

  <!-- ── MAIN BUILDING ── -->

  <!-- Building body -->
  <rect x="200" y="170" width="400" height="190" fill="url(#body)" filter="url(#shadow)"/>

  <!-- Pediment (triangular top) -->
  <polygon points="185,170 400,80 615,170" fill="#1a3256" filter="url(#shadow)"/>
  <polygon points="195,170 400,88 605,170" fill="#1e3a6b"/>
  <!-- Pediment gold border -->
  <polyline points="185,170 400,80 615,170" fill="none" stroke="url(#gold)" stroke-width="2.5"/>

  <!-- Pediment decoration -->
  <!-- Shield/emblem in pediment -->
  <ellipse cx="400" cy="138" rx="32" ry="38" fill="#162d4f" stroke="url(#gold)" stroke-width="1.5"/>
  <text x="400" y="148" text-anchor="middle" font-size="28" fill="url(#gold)">⚖</text>

  <!-- Cornice (entablature) -->
  <rect x="190" y="168" width="420" height="22" fill="#1a3256"/>
  <rect x="190" y="168" width="420" height="3" fill="url(#goldH)"/>
  <rect x="190" y="187" width="420" height="3" fill="url(#goldH)"/>

  <!-- Triglyphs on frieze -->
  <g fill="#162d4f">
    <rect x="205" y="171" width="12" height="14"/><rect x="230" y="171" width="12" height="14"/>
    <rect x="255" y="171" width="12" height="14"/><rect x="280" y="171" width="12" height="14"/>
    <rect x="305" y="171" width="12" height="14"/><rect x="330" y="171" width="12" height="14"/>
    <rect x="355" y="171" width="12" height="14"/><rect x="380" y="171" width="12" height="14"/>
    <rect x="405" y="171" width="12" height="14"/><rect x="430" y="171" width="12" height="14"/>
    <rect x="455" y="171" width="12" height="14"/><rect x="480" y="171" width="12" height="14"/>
    <rect x="505" y="171" width="12" height="14"/><rect x="530" y="171" width="12" height="14"/>
    <rect x="555" y="171" width="12" height="14"/>
  </g>

  <!-- Columns (8 columns) -->
  <g filter="url(#shadow)">
    <!-- Col 1 -->
    <rect x="208" y="190" width="26" height="166" fill="url(#col)" rx="2"/>
    <ellipse cx="221" cy="190" rx="14" ry="5" fill="#2d5a8e"/>
    <ellipse cx="221" cy="356" rx="14" ry="5" fill="#2d5a8e"/>
    <!-- Col 2 -->
    <rect x="262" y="190" width="26" height="166" fill="url(#col)" rx="2"/>
    <ellipse cx="275" cy="190" rx="14" ry="5" fill="#2d5a8e"/>
    <ellipse cx="275" cy="356" rx="14" ry="5" fill="#2d5a8e"/>
    <!-- Col 3 -->
    <rect x="316" y="190" width="26" height="166" fill="url(#col)" rx="2"/>
    <ellipse cx="329" cy="190" rx="14" ry="5" fill="#2d5a8e"/>
    <ellipse cx="329" cy="356" rx="14" ry="5" fill="#2d5a8e"/>
    <!-- Col 4 -->
    <rect x="370" y="190" width="26" height="166" fill="url(#col)" rx="2"/>
    <ellipse cx="383" cy="190" rx="14" ry="5" fill="#2d5a8e"/>
    <ellipse cx="383" cy="356" rx="14" ry="5" fill="#2d5a8e"/>
    <!-- Col 5 -->
    <rect x="404" y="190" width="26" height="166" fill="url(#col)" rx="2"/>
    <ellipse cx="417" cy="190" rx="14" ry="5" fill="#2d5a8e"/>
    <ellipse cx="417" cy="356" rx="14" ry="5" fill="#2d5a8e"/>
    <!-- Col 6 -->
    <rect x="458" y="190" width="26" height="166" fill="url(#col)" rx="2"/>
    <ellipse cx="471" cy="190" rx="14" ry="5" fill="#2d5a8e"/>
    <ellipse cx="471" cy="356" rx="14" ry="5" fill="#2d5a8e"/>
    <!-- Col 7 -->
    <rect x="512" y="190" width="26" height="166" fill="url(#col)" rx="2"/>
    <ellipse cx="525" cy="190" rx="14" ry="5" fill="#2d5a8e"/>
    <ellipse cx="525" cy="356" rx="14" ry="5" fill="#2d5a8e"/>
    <!-- Col 8 -->
    <rect x="566" y="190" width="26" height="166" fill="url(#col)" rx="2"/>
    <ellipse cx="579" cy="190" rx="14" ry="5" fill="#2d5a8e"/>
    <ellipse cx="579" cy="356" rx="14" ry="5" fill="#2d5a8e"/>
  </g>

  <!-- Column light effect -->
  <g fill="white" opacity="0.06">
    <rect x="213" y="190" width="6" height="166" rx="3"/>
    <rect x="267" y="190" width="6" height="166" rx="3"/>
    <rect x="321" y="190" width="6" height="166" rx="3"/>
    <rect x="375" y="190" width="6" height="166" rx="3"/>
    <rect x="409" y="190" width="6" height="166" rx="3"/>
    <rect x="463" y="190" width="6" height="166" rx="3"/>
    <rect x="517" y="190" width="6" height="166" rx="3"/>
    <rect x="571" y="190" width="6" height="166" rx="3"/>
  </g>

  <!-- Stylobate (base) -->
  <rect x="195" y="354" width="410" height="12" fill="#1a3256"/>
  <rect x="195" y="354" width="410" height="2" fill="url(#goldH)"/>

  <!-- Windows (glowing) -->
  <g>
    <!-- Row 1 -->
    <rect x="245" y="215" width="36" height="50" fill="#1e4080" rx="3"/>
    <rect x="245" y="215" width="36" height="50" fill="#93c5fd" opacity="0.15" rx="3"/>
    <line x1="263" y1="215" x2="263" y2="265" stroke="#1a3a6b" stroke-width="1"/>
    <line x1="245" y1="240" x2="281" y2="240" stroke="#1a3a6b" stroke-width="1"/>

    <rect x="295" y="215" width="36" height="50" fill="#1e4080" rx="3"/>
    <rect x="295" y="215" width="36" height="50" fill="#fbbf24" opacity="0.12" rx="3"/>
    <line x1="313" y1="215" x2="313" y2="265" stroke="#1a3a6b" stroke-width="1"/>
    <line x1="295" y1="240" x2="331" y2="240" stroke="#1a3a6b" stroke-width="1"/>

    <rect x="469" y="215" width="36" height="50" fill="#1e4080" rx="3"/>
    <rect x="469" y="215" width="36" height="50" fill="#93c5fd" opacity="0.15" rx="3"/>
    <line x1="487" y1="215" x2="487" y2="265" stroke="#1a3a6b" stroke-width="1"/>
    <line x1="469" y1="240" x2="505" y2="240" stroke="#1a3a6b" stroke-width="1"/>

    <rect x="519" y="215" width="36" height="50" fill="#1e4080" rx="3"/>
    <rect x="519" y="215" width="36" height="50" fill="#fbbf24" opacity="0.12" rx="3"/>
    <line x1="537" y1="215" x2="537" y2="265" stroke="#1a3a6b" stroke-width="1"/>
    <line x1="519" y1="240" x2="555" y2="240" stroke="#1a3a6b" stroke-width="1"/>

    <!-- Row 2 -->
    <rect x="245" y="282" width="36" height="50" fill="#1e4080" rx="3"/>
    <rect x="245" y="282" width="36" height="50" fill="#fbbf24" opacity="0.12" rx="3"/>
    <line x1="263" y1="282" x2="263" y2="332" stroke="#1a3a6b" stroke-width="1"/>
    <line x1="245" y1="307" x2="281" y2="307" stroke="#1a3a6b" stroke-width="1"/>

    <rect x="295" y="282" width="36" height="50" fill="#1e4080" rx="3"/>
    <rect x="295" y="282" width="36" height="50" fill="#93c5fd" opacity="0.15" rx="3"/>
    <line x1="313" y1="282" x2="313" y2="332" stroke="#1a3a6b" stroke-width="1"/>
    <line x1="295" y1="307" x2="331" y2="307" stroke="#1a3a6b" stroke-width="1"/>

    <rect x="469" y="282" width="36" height="50" fill="#1e4080" rx="3"/>
    <rect x="469" y="282" width="36" height="50" fill="#fbbf24" opacity="0.12" rx="3"/>
    <line x1="487" y1="282" x2="487" y2="332" stroke="#1a3a6b" stroke-width="1"/>
    <line x1="469" y1="307" x2="505" y2="307" stroke="#1a3a6b" stroke-width="1"/>

    <rect x="519" y="282" width="36" height="50" fill="#1e4080" rx="3"/>
    <rect x="519" y="282" width="36" height="50" fill="#93c5fd" opacity="0.15" rx="3"/>
    <line x1="537" y1="282" x2="537" y2="332" stroke="#1a3a6b" stroke-width="1"/>
    <line x1="519" y1="307" x2="555" y2="307" stroke="#1a3a6b" stroke-width="1"/>
  </g>

  <!-- Central Door -->
  <rect x="360" y="270" width="80" height="90" fill="#0f1e35" rx="4"/>
  <rect x="360" y="270" width="80" height="90" fill="url(#glow)" rx="4"/>
  <!-- Door arch -->
  <path d="M360,285 Q400,260 440,285" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <!-- Door frame -->
  <rect x="360" y="270" width="80" height="90" fill="none" stroke="url(#gold)" stroke-width="1.5" rx="4"/>
  <!-- Door panels -->
  <line x1="400" y1="270" x2="400" y2="360" stroke="url(#gold)" stroke-width="1" opacity="0.5"/>
  <rect x="366" y="280" width="28" height="35" fill="none" stroke="url(#gold)" stroke-width="0.8" rx="2" opacity="0.4"/>
  <rect x="406" y="280" width="28" height="35" fill="none" stroke="url(#gold)" stroke-width="0.8" rx="2" opacity="0.4"/>
  <!-- Door knobs -->
  <circle cx="394" cy="318" r="3" fill="url(#gold)"/>
  <circle cx="406" cy="318" r="3" fill="url(#gold)"/>

  <!-- Lamp posts -->
  <g stroke="url(#gold)" stroke-width="2" fill="none">
    <!-- Left lamp -->
    <line x1="248" y1="390" x2="248" y2="460" stroke="#b45309" stroke-width="3"/>
    <path d="M248,390 Q248,368 260,368 Q275,368 275,380" stroke="url(#gold)"/>
    <ellipse cx="275" cy="380" rx="10" ry="5" fill="#fde68a" opacity="0.9"/>
    <ellipse cx="275" cy="380" rx="18" ry="9" fill="url(#glow)" opacity="0.6"/>
    <!-- Right lamp -->
    <line x1="552" y1="390" x2="552" y2="460" stroke="#b45309" stroke-width="3"/>
    <path d="M552,390 Q552,368 540,368 Q525,368 525,380" stroke="url(#gold)"/>
    <ellipse cx="525" cy="380" rx="10" ry="5" fill="#fde68a" opacity="0.9"/>
    <ellipse cx="525" cy="380" rx="18" ry="9" fill="url(#glow)" opacity="0.6"/>
  </g>

  <!-- Lamp glow on ground -->
  <ellipse cx="275" cy="400" rx="30" ry="10" fill="#fde68a" opacity="0.08"/>
  <ellipse cx="525" cy="400" rx="30" ry="10" fill="#fde68a" opacity="0.08"/>

  <!-- ── FLOATING CARD (right side) ── -->
  <g transform="translate(590, 200)" filter="url(#shadow)">
    <rect width="155" height="95" rx="12" fill="url(#cardShine)"/>
    <!-- Card shine -->
    <rect width="155" height="40" rx="12" fill="white" opacity="0.05"/>
    <!-- Chip -->
    <rect x="14" y="28" width="28" height="22" rx="4" fill="#fbbf24" opacity="0.8"/>
    <line x1="14" y1="37" x2="42" y2="37" stroke="#b45309" stroke-width="1" opacity="0.5"/>
    <line x1="14" y1="43" x2="42" y2="43" stroke="#b45309" stroke-width="1" opacity="0.5"/>
    <line x1="28" y1="28" x2="28" y2="50" stroke="#b45309" stroke-width="1" opacity="0.5"/>
    <!-- Contactless symbol -->
    <g fill="none" stroke="white" stroke-width="1.5" opacity="0.6" transform="translate(120,15)">
      <path d="M0,7 Q5,2 10,7"/><path d="M-3,10 Q7,-2 17,10"/><path d="M-6,13 Q9,-5 24,13"/>
    </g>
    <!-- Card number -->
    <text x="14" y="70" font-size="8" fill="white" opacity="0.8" letter-spacing="1" font-family="Courier New">•••• •••• •••• 4247</text>
    <!-- Name -->
    <text x="14" y="85" font-size="7" fill="white" opacity="0.6" font-family="Georgia">A. GAYE</text>
    <!-- Logo -->
    <circle cx="132" cy="75" r="10" fill="#ef4444" opacity="0.8"/>
    <circle cx="143" cy="75" r="10" fill="#f97316" opacity="0.8"/>
  </g>

  <!-- ── FLOATING COINS (left side) ── -->
  <g opacity="0.9">
    <ellipse cx="120" cy="290" rx="28" ry="10" fill="#b45309" filter="url(#shadow)"/>
    <rect x="92" y="270" width="56" height="20" fill="#d97706"/>
    <ellipse cx="120" cy="270" rx="28" ry="10" fill="#fbbf24"/>
    <text x="120" y="274" text-anchor="middle" font-size="10" fill="#92400e" font-weight="bold">XOF</text>

    <ellipse cx="108" cy="318" rx="22" ry="8" fill="#b45309" filter="url(#shadow)"/>
    <rect x="86" y="302" width="44" height="16" fill="#d97706"/>
    <ellipse cx="108" cy="302" rx="22" ry="8" fill="#fbbf24"/>
    <text x="108" y="306" text-anchor="middle" font-size="8" fill="#92400e" font-weight="bold">XOF</text>

    <ellipse cx="135" cy="335" rx="18" ry="7" fill="#b45309"/>
    <rect x="117" y="322" width="36" height="13" fill="#d97706"/>
    <ellipse cx="135" cy="322" rx="18" ry="7" fill="#fbbf24"/>
  </g>

  <!-- ── BANK NAME ── -->
  <g filter="url(#glow-filter)">
    <text x="400" y="480" text-anchor="middle" font-size="42" font-weight="bold" fill="url(#gold)" letter-spacing="6" font-family="Georgia, serif">E·BANK</text>
  </g>
  <text x="400" y="500" text-anchor="middle" font-size="11" fill="#93c5fd" letter-spacing="4" opacity="0.8">BANQUE NUMÉRIQUE DE CONFIANCE</text>

  <!-- Decorative gold line under name -->
  <line x1="300" y1="508" x2="500" y2="508" stroke="url(#goldH)" stroke-width="1.5" opacity="0.6"/>
  <circle cx="300" cy="508" r="2" fill="#f59e0b"/>
  <circle cx="500" cy="508" r="2" fill="#f59e0b"/>
  <circle cx="400" cy="508" r="3" fill="#fde68a"/>

  <!-- Reflection on ground -->
  <g opacity="0.08" transform="scale(1,-1) translate(0,-800)">
    <polygon points="185,170 400,80 615,170" fill="#2563eb"/>
  </g>
</svg>
